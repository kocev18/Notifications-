name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cloudflare - акаунт и KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          ACC=$(api https://api.cloudflare.com/client/v4/accounts | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'])")
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> $GITHUB_ENV
          KV=$(api "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces?per_page=100" | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((n['id'] for n in d['result'] if n['title']=='zadachi-kv'),''))")
          if [ -z "$KV" ]; then
            KV=$(api -X POST "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces" --data '{"title":"zadachi-kv"}' | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['id'])")
          fi
          cat > wrangler.toml <<TOML
          name = "zadachi"
          main = "worker.js"
          compatibility_date = "2025-01-01"
          [[kv_namespaces]]
          binding = "KV"
          id = "$KV"
          [triggers]
          crons = ["* * * * *"]
          TOML
          sed -i 's/^          //' wrangler.toml
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy
      - name: Тайни
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          printf %s "$WORKER_TOKEN" | npx --yes wrangler@4 secret put TOKEN
          printf %s "$VAPID_PRIVATE" | npx --yes wrangler@4 secret put VAPID_PRIVATE
          printf %s "$VAPID_SUBJECT" | npx --yes wrangler@4 secret put VAPID_SUBJECT
  pages:
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - run: mkdir site && cp index.html sw.js manifest.webmanifest icon*.png site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
